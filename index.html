<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מבחן תפריט · ללוש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9e0cf; --paper2:#f6f1e7; --card:#fffdf8; --ink:#23323a; --muted:#6b7a80;
  --teal:#2f5d6e; --teal2:#3f7a8c; --gold:#d79a2b; --gold2:#f0c15c;
  --ok:#2e9e6a; --okbg:#e3f5ec; --bad:#d9534f; --badbg:#fbe7e6; --warn:#e08a1e;
  --r:18px; --shadow:0 6px 20px rgba(35,50,58,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;background:
  radial-gradient(circle at 10% 0%,rgba(215,154,43,.12),transparent 40%),
  radial-gradient(circle at 100% 30%,rgba(47,93,110,.10),transparent 45%),var(--paper)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.back{background:var(--card);width:42px;height:42px;border-radius:14px;font-size:20px;box-shadow:var(--shadow)}
.pill{background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);display:inline-flex;gap:6px;align-items:center}
.logo{font-weight:900;letter-spacing:.5px;color:var(--teal);font-size:15px;direction:ltr}
.logo span{border-bottom:2px solid var(--teal);padding:0 2px;margin:0 2px;font-size:12px}
h1{font-size:30px;margin:6px 0 2px;font-weight:900}
h2{font-size:20px;margin:18px 0 10px;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.hero{background:linear-gradient(135deg,var(--teal),#1f4150);color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"🍽️";position:absolute;left:-10px;bottom:-22px;font-size:110px;opacity:.12;transform:rotate(-15deg)}
.hero .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.13);border-radius:14px;padding:8px 12px;font-size:13px}
.stat b{display:block;font-size:20px}
.lvlbar{height:10px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:12px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .6s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mode{background:var(--card);border-radius:var(--r);padding:16px 14px;text-align:right;box-shadow:var(--shadow);transition:transform .12s;min-height:118px;display:flex;flex-direction:column;gap:4px}
.mode:active{transform:scale(.97)}
.mode .ic{font-size:30px}
.mode b{font-size:17px}
.mode small{color:var(--muted);font-size:13px;line-height:1.35}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;background:linear-gradient(135deg,#fff6e3,#ffe9bd)}
.mode.wide .ic{font-size:38px}
.catlist{display:flex;flex-direction:column;gap:10px}
.cat{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);text-align:right;width:100%}
.cat .em{font-size:26px;width:36px;text-align:center}
.cat .t{flex:1}
.cat .t b{display:block;font-size:16px}
.cat .t small{color:var(--muted)}
.bar{height:7px;background:#ece4d4;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--ok));border-radius:9px}
.pct{font-weight:800;color:var(--teal);font-size:14px;min-width:42px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper2);border:2px solid #e2d7c3;border-radius:999px;padding:8px 13px;font-size:15px;font-weight:500;transition:all .15s;line-height:1.25}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.good{background:var(--okbg);border-color:var(--ok);color:#17663f}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:#9b2622;text-decoration:line-through}
.chip.miss{background:#fff4e0;border-color:var(--warn);color:#8a4d00;border-style:dashed}
.chip.ro{cursor:default}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:10px;background:#ddd2bf;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .35s}
.qcard{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.qtype{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.3px;margin-bottom:6px}
.qtext{font-size:21px;font-weight:800;line-height:1.35;margin:0 0 6px}
.qdish{display:inline-block;background:#eef4f6;color:var(--teal);border-radius:10px;padding:2px 10px;margin-top:2px}
.qsub{color:var(--muted);font-size:14px;margin-bottom:14px}
.ings{background:var(--paper2);border-radius:14px;padding:12px 14px;margin:10px 0 14px;font-size:16px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--paper2);border:2px solid #e2d7c3;border-radius:16px;padding:14px 16px;text-align:right;font-size:17px;font-weight:600;transition:all .15s}
.opt:active{transform:scale(.98)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-size:20px;padding:18px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{display:block;width:100%;background:var(--teal);color:#fff;border-radius:16px;padding:15px;font-size:17px;font-weight:800;margin-top:14px;box-shadow:0 6px 14px rgba(47,93,110,.25)}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3b2a06}
.btn.ghost{background:var(--card);color:var(--teal);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45}
.fb{margin-top:14px;border-radius:16px;padding:14px;animation:pop .2s}
.fb.ok{background:var(--okbg)}
.fb.no{background:var(--badbg)}
.fb .t{font-weight:900;font-size:18px;margin-bottom:6px}
.mini{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.55}
.mini b{color:var(--teal)}
.combo{font-weight:900;color:var(--gold);font-size:15px;min-width:54px;text-align:center}
.combo.hot{animation:pulse .6s infinite alternate;color:#e0561e}
@keyframes pulse{to{transform:scale(1.15)}}
.timer{font-weight:900;font-size:18px;color:var(--teal);min-width:46px;text-align:center}
.timer.low{color:var(--bad)}
/* flashcards */
.flip{perspective:1200px;margin-top:6px}
.fc{cursor:pointer}
.face{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;min-height:340px;animation:flipin .35s ease}
@keyframes flipin{from{transform:rotateY(90deg);opacity:.3}to{transform:none;opacity:1}}
.face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#fff,#f8efdc)}
.face.front .nm{font-size:28px;font-weight:900;line-height:1.25}
.face.front .hint{color:var(--muted);margin-top:16px;font-size:14px}
.face.rear,.fc.flipped .face.front{display:none}
.fc.flipped .face.rear{display:block}
.dishname{font-size:21px;font-weight:900;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.price{background:var(--gold);color:#3b2a06;border-radius:10px;padding:2px 10px;font-weight:900;white-space:nowrap;font-size:16px}
.desc{font-size:16px;line-height:1.65;margin:10px 0}
.note{background:#fff6e3;border-right:4px solid var(--gold);padding:8px 10px;border-radius:8px;font-size:14px;margin-top:6px}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:#e7f1e9;color:#256b40}
.tag.h{background:#fde6dc;color:#b3401a}
.tag.b{background:#fff1cf;color:#8a5a00}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter{text-align:center;color:var(--muted);font-weight:700;margin:10px 0 0}
/* menu browser */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid #e2d7c3;background:var(--card);font-size:16px;font-family:inherit;margin-bottom:12px}
.dish{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.dish .dishname{font-size:17px}
.dish .desc{font-size:15px;margin:6px 0 0}
.mast{font-size:12px;color:var(--muted);margin-top:6px}
.dots{letter-spacing:2px}
.sec{position:sticky;top:0;background:var(--paper);padding:10px 0 6px;z-index:2;font-weight:900;font-size:19px;color:var(--teal)}
.sec small{display:block;color:var(--muted);font-weight:500;font-size:13px}
/* results */
.score{font-size:64px;font-weight:900;text-align:center;color:var(--teal);margin:6px 0 0}
.grade{text-align:center;font-size:20px;font-weight:800;margin-bottom:8px}
.mistake{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border-right:5px solid var(--bad)}
.mistake .q{font-weight:800;margin-bottom:4px}
.mistake .a{color:var(--ok);font-weight:700}
.mistake .y{color:var(--bad);font-size:14px}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;font-weight:700}
.sw{width:50px;height:28px;border-radius:99px;background:#cfc5b2;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on:after{right:25px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:50;animation:pop .25s;box-shadow:var(--shadow)}
.xpfly{position:fixed;font-weight:900;color:var(--gold);font-size:22px;pointer-events:none;z-index:40;animation:fly 1s forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.center{text-align:center}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>

<script>
"use strict";
// ================= state =================
const LS = "lalush-trainer-v1";
const S = Object.assign({ m:{}, xp:0, best:{sprint:0, exam:0}, day:{last:"", count:0}, cats:null, sound:true, answered:0, correct:0 },
  (() => { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } })());
if (!S.cats) S.cats = CATS.map(c => c.id);
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };

const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const FACTS2 = FACTS.map((f, k) => ({ ...f, id: "f" + k, fact: 1 }));
const FOOD = DISHES.filter(d => CAT[d.c].group === "food");
const $app = document.getElementById("app");

// ================= helpers =================
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = rnd(k + 1); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const priceTxt = p => typeof p === "number" ? p + "₪" : String(p).replace("/", "₪ / ") + "₪";
const mastery = id => S.m[id] || 0;
const MAXM = 4;
const STOP = new Set(["על","עם","של","טרי","טריה","טריות","טריים","קלוי","קלויה","קלויים","צלוי","מגורר","מבחר","מיקס","קרם","רוטב","גבינת","זילופי","עלי","בצל","ממרח","קוביות","ביתי","עשבי","לבחירה","מוקפצים","דק","המון","פרוס","תיבול"]);
const words = s => s.replace(/[(),./]/g, " ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
function similar(a, b) {
  if (a === b || a.includes(b) || b.includes(a)) return true;
  const wa = words(a), wb = new Set(words(b));
  return wa.some(w => wb.has(w));
}
const hasIng = (d, ing) => (d.i || []).some(x => similar(x, ing));
const enabledDishes = () => DISHES.filter(d => S.cats.includes(d.c));
const enabledFacts = () => FACTS2.filter(f => S.cats.includes(f.c));

function bump(id, ok) {
  const m = mastery(id);
  S.m[id] = ok ? Math.min(MAXM, m + 1) : Math.max(0, m - 2);
  S.answered++; if (ok) S.correct++;
  save();
}
function addXP(n, el) {
  S.xp += n; save();
  if (el && n > 0) {
    const r = el.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "xpfly"; f.textContent = "+" + n + " XP";
    f.style.left = (r.left + r.width / 2 - 30) + "px"; f.style.top = (r.top) + "px";
    document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
  }
}
const LEVELS = [
  [0, "מתלמדת 🌱"], [150, "מלצרית מתחילה 🍽️"], [400, "מכירה את המטבח 👩‍🍳"], [800, "מלצרית מנוסה ⭐"],
  [1400, "מומחית תפריט 🏅"], [2200, "אלופת ללוש 👑"], [3500, "אגדה של חולון 🔥"]];
function level() {
  let k = 0; while (k + 1 < LEVELS.length && S.xp >= LEVELS[k + 1][0]) k++;
  const cur = LEVELS[k][0], nxt = LEVELS[k + 1] ? LEVELS[k + 1][0] : cur + 1000;
  return { n: k + 1, name: LEVELS[k][1], pct: Math.min(100, (S.xp - cur) / (nxt - cur) * 100), next: nxt };
}
function touchDay() {
  const today = new Date().toDateString();
  if (S.day.last === today) return;
  const y = new Date(Date.now() - 864e5).toDateString();
  S.day.count = S.day.last === y ? S.day.count + 1 : 1;
  S.day.last = today; save();
}
function catPct(cid) {
  const items = DISHES.filter(d => d.c === cid).map(d => d.id).concat(FACTS2.filter(f => f.c === cid).map(f => f.id));
  if (!items.length) return 0;
  return Math.round(items.reduce((s, id) => s + mastery(id), 0) / (items.length * MAXM) * 100);
}
function totalPct() {
  const ids = DISHES.map(d => d.id).concat(FACTS2.map(f => f.id));
  return Math.round(ids.reduce((s, id) => s + mastery(id), 0) / (ids.length * MAXM) * 100);
}
function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1800);
}

// ================= sound + confetti =================
let AC;
function beep(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [[660, .07], [880, .12]], bad: [[220, .18]], win: [[523, .1], [659, .1], [784, .1], [1046, .25]], tick: [[900, .03]] }[kind];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "bad" ? "sawtooth" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(kind === "bad" ? [60, 40, 60] : kind === "ok" ? 15 : 0);
}
const cf = document.getElementById("cf"), cx = cf.getContext("2d"); let parts = [], cfOn = false;
function confetti(n = 120) {
  cf.width = innerWidth; cf.height = innerHeight;
  const cols = ["#d79a2b", "#f0c15c", "#2f5d6e", "#2e9e6a", "#e0561e", "#ffffff"];
  for (let k = 0; k < n; k++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: pick(cols), a: Math.random() * 6, life: 120 });
  if (!cfOn) { cfOn = true; requestAnimationFrame(cfLoop); }
}
function cfLoop() {
  cx.clearRect(0, 0, cf.width, cf.height);
  parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; p.life--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < cf.height + 20);
  if (parts.length) requestAnimationFrame(cfLoop); else { cfOn = false; cx.clearRect(0, 0, cf.width, cf.height); }
}

// ================= question generation =================
function weightedPick(items) {
  const w = items.map(it => { const m = mastery(it.id); return ((MAXM + 1 - m) ** 2 + (S.m[it.id] === undefined ? 3 : 0)) * (it.fact ? .6 : it.i ? 1 : .3); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let k = 0; k < items.length; k++) { r -= w[k]; if (r <= 0) return items[k]; }
  return items[items.length - 1];
}
function peers(d, pool, n, filter) {
  const same = shuffle(pool.filter(x => x !== d && x.c === d.c && (!filter || filter(x))));
  const other = shuffle(pool.filter(x => x !== d && x.c !== d.c && CAT[x.c].group === CAT[d.c].group && (!filter || filter(x))));
  return same.concat(other).slice(0, n);
}
function distractors(d, n) {
  const near = shuffle(DISHES.filter(x => x !== d && x.i && CAT[x.c].group === CAT[d.c].group).flatMap(x => x.i));
  const out = [];
  for (const ing of near) {
    if (out.length >= n) break;
    if (!hasIng(d, ing) && !out.some(o => similar(o, ing))) out.push(ing);
  }
  return out;
}
const TYPES = {
  name: d => d.i && d.i.length >= 2,
  build: d => d.i && d.i.length >= 3,
  odd: d => d.i && d.i.length >= 3,
  tf: d => d.i && d.i.length >= 2,
  price: d => typeof d.p === "number",
  which: d => d.i && d.i.length >= 2,
  vegan: d => d.v && CAT[d.c].group === "food",
};
const TYPE_W = { name: 3, build: 3, odd: 2, tf: 2, price: 2, which: 2, vegan: 1 };

function makeQ(d, allowed) {
  if (d.fact) return factQ(d);
  const types = Object.keys(TYPES).filter(t => TYPES[t](d) && (!allowed || allowed.includes(t)));
  if (!types.length) return null;
  let r = Math.random() * types.reduce((s, t) => s + TYPE_W[t], 0), t = types[0];
  for (const x of types) { r -= TYPE_W[x]; if (r <= 0) { t = x; break; } }
  return GEN[t](d) || (t !== "price" && TYPES.price(d) ? GEN.price(d) : null);
}
function factQ(f) {
  return { kind: "opts", item: f, label: "שאלת ידע 🧠", text: f.q,
    opts: shuffle([{ t: f.a, ok: 1 }].concat(f.w.map(t => ({ t })))), answer: f.a };
}
const GEN = {
  name(d) {
    const pool = enabledDishes().filter(x => x.i && x.i.length >= 2);
    const others = peers(d, pool, 3);
    if (others.length < 3) return null;
    return { kind: "opts", item: d, label: "איזו מנה זו? 🔎", text: "איזו מנה מכילה את כל אלה?",
      ings: d.i.join(" · "), opts: shuffle([{ t: d.n, ok: 1 }].concat(others.map(o => ({ t: o.n })))), answer: d.n };
  },
  build(d) {
    const real = shuffle(d.i).slice(0, 7);
    const fake = distractors(d, Math.max(4, 11 - real.length));
    if (fake.length < 3) return null;
    return { kind: "build", item: d, label: "בני את המנה 🧩", text: d.n,
      sub: "סמני את כל מה שנמצא במנה (" + real.length + " נכונים מסתתרים כאן)",
      chips: shuffle(real.map(t => ({ t, ok: 1 })).concat(fake.map(t => ({ t })))), answer: d.i.join(", ") };
  },
  odd(d) {
    const real = shuffle(d.i).slice(0, 3), fake = distractors(d, 1);
    if (!fake.length) return null;
    return { kind: "opts", item: d, label: "מי לא שייך? 🕵️‍♀️", text: "מה מהבאים לא נמצא ב" + "<span class='qdish'>" + esc(d.n) + "</span>?",
      html: 1, opts: shuffle(real.map(t => ({ t })).concat([{ t: fake[0], ok: 1 }])), answer: fake[0] + " (לא במנה)" };
  },
  tf(d) {
    const truth = Math.random() < .5;
    const ing = truth ? pick(d.i) : distractors(d, 1)[0];
    if (!ing) return null;
    return { kind: "tf", item: d, label: "נכון או לא? ⚡", html: 1,
      text: "יש <u>" + esc(ing) + "</u> ב" + "<span class='qdish'>" + esc(d.n) + "</span>?",
      opts: [{ t: "כן ✓", ok: truth ? 1 : 0 }, { t: "לא ✗", ok: truth ? 0 : 1 }], answer: truth ? "כן, יש" : "לא, אין" };
  },
  price(d) {
    const near = DISHES.filter(x => x.c === d.c && typeof x.p === "number" && x.p !== d.p).map(x => x.p);
    const set = new Set();
    shuffle(near).forEach(p => set.size < 3 && set.add(p));
    const deltas = shuffle([-10, -6, -4, -2, 2, 4, 6, 10]);
    for (const k of deltas) { if (set.size >= 3) break; const v = d.p + k; if (v > 0 && v !== d.p) set.add(v); }
    return { kind: "opts", item: d, label: "כמה זה עולה? 💰", html: 1,
      text: "מה המחיר של <span class='qdish'>" + esc(d.n) + "</span>?",
      opts: shuffle([{ t: d.p + "₪", ok: 1 }].concat([...set].slice(0, 3).map(p => ({ t: p + "₪" })))), answer: d.p + "₪" };
  },
  which(d) {
    const pool = enabledDishes().filter(x => x.i);
    const cands = shuffle(d.i).map(ing => ({ ing, n: pool.filter(x => hasIng(x, ing)).length })).sort((a, b) => a.n - b.n);
    for (const { ing } of cands) {
      const others = peers(d, pool, 3, x => !hasIng(x, ing));
      if (others.length === 3)
        return { kind: "opts", item: d, label: "איפה זה מסתתר? 🗺️", html: 1,
          text: "באיזו מנה יש <u>" + esc(ing) + "</u>?", opts: shuffle([{ t: d.n, ok: 1 }].concat(others.map(o => ({ t: o.n })))), answer: d.n };
    }
    return null;
  },
  vegan(d) {
    const others = peers(d, enabledDishes().filter(x => CAT[x.c].group === "food"), 3, x => !x.v);
    if (others.length < 3) return null;
    return { kind: "opts", item: d, label: "עלה ירוק 🌿", text: "איזו מנה מסומנת בתפריט כטבעונית?",
      opts: shuffle([{ t: d.n, ok: 1 }].concat(others.map(o => ({ t: o.n })))), answer: d.n };
  },
};
function nextQ(allowed, avoid) {
  let pool = enabledDishes().filter(d => Object.keys(TYPES).some(t => TYPES[t](d) && (!allowed || allowed.includes(t))));
  if (!allowed || allowed.includes("fact")) pool = pool.concat(enabledFacts());
  if (avoid && pool.length > 6) pool = pool.filter(x => !avoid.includes(x.id));
  for (let tries = 0; tries < 30; tries++) {
    const q = makeQ(weightedPick(pool), allowed);
    if (q) return q;
  }
  return null;
}

let view = "home", stopTimer = null;

  if (stopTimer) { stopTimer(); stopTimer = null; }
  view = v; window.scrollTo(0, 0);

let D = null;
function deck(cid) {
  let items;
  if (cid === "weak") items = DISHES.filter(d => S.cats.includes(d.c) && (d.i || d.d)).sort((a, b) => mastery(a.id) - mastery(b.id) || Math.random() - .5).slice(0, 15);
  else items = DISHES.filter(d => d.c === cid || (cid === "breakfast" && d.b));

    $app.innerHTML = hdr(title) + `<div class="qcard center"><div style="font-size:60px">🎉</div><h2>סיימת את החבילה!</h2><p class="sub">ידעת ${D.known} מתוך ${D.items.length}</p>
    <button class="btn" onclick="deck('${D.cid}')">עוד סיבוב (מעורבב)</button>

    <button class="btn ghost" onclick="go('study')">חזרה לקטגוריות</button></div>`;
    return;
  }
  const d = D.items[D.k], m = mastery(d.id);
  $app.innerHTML = hdr(title, `<span class="pill">${D.k + 1}/${D.items.length}</span>`) + `
  <div class="prog" style="margin-bottom:12px"><i style="width:${D.k / D.items.length * 100}%"></i></div>
  <div class="flip"><div class="fc" id="fc" onclick="this.classList.toggle('flipped')">
    <div class="face front"><div style="font-size:42px">${CAT[d.c].emoji}</div><div class="nm">${esc(d.n)}</div>
      <div class="hint">${d.i ? "מה יש במנה? נסי למנות " + d.i.length + " רכיבים בראש" : "כמה זה עולה?"}<br>👆 הקישי כדי להפוך</div>
      <div class="mast">שליטה: <span class="dots">${"●".repeat(m)}${"○".repeat(MAXM - m)}</span></div></div>
    <div class="face rear">${dishCard(d, { chips: true })}</div>
  </div></div>
  <div class="row2" style="margin-top:14px">
    <button class="btn ghost" style="margin:0;color:var(--bad)" onclick="cardAns(0)">😅 עוד לא</button>

  </div>`;
}
function cardAns(ok) {
  const d = D.items[D.k];
  S.m[d.id] = ok ? Math.min(MAXM, mastery(d.id) + 1) : Math.max(0, mastery(d.id) - 1);
  if (ok) { D.known++; addXP(3); beep("ok"); } else { beep("tick"); D.items.push(d); }
  save(); D.k++; drawCard();
}

    }).join("") || `<p class="sub center">לא נמצא כלום 🤷‍♀️</p>`;

function togCat(id) {

// ================= quiz engine =================
let Q = null;
function quiz(cfg) {
  const savedCats = S.cats;
  if (cfg.only) S.cats = [cfg.only];
  const allowed = { sprint: ["name", "tf", "price", "odd", "which", "fact"], build: ["build"] }[cfg.mode] || null;
  Q = { cfg, allowed, n: 0, right: 0, combo: 0, bestCombo: 0, xp: 0, recent: [], log: [], total: cfg.mode === "exam" ? 25 : 0, time: 60, restoreCats: cfg.only ? savedCats : null };
  if (cfg.mode === "sprint") {
    const t0 = Date.now(); let pen = 0;
    Q.addPenalty = s => pen += s;
    const iv = setInterval(() => {
      Q.time = Math.max(0, 60 - Math.floor((Date.now() - t0) / 1000) - pen);
      const el = document.getElementById("tm");
      if (el) { el.textContent = Q.time + "s"; el.classList.toggle("low", Q.time <= 10); }
      if (Q.time <= 0) { clearInterval(iv); stopTimer = null; finish(); }
    }, 200);
    stopTimer = () => clearInterval(iv);
  }
  const prevStop = stopTimer;
  stopTimer = () => { prevStop && prevStop(); if (Q && Q.restoreCats) { S.cats = Q.restoreCats; Q.restoreCats = null; save(); } };
  nextQuestion();
}
function nextQuestion() {
  if (Q.total && Q.n >= Q.total) return finish();
  const q = nextQ(Q.allowed, Q.recent);
  if (!q) { $app.innerHTML = hdr("אופס") + `<p class="sub">אין מספיק שאלות לקטגוריות שנבחרו. נסי להוסיף קטגוריות בהגדרות.</p>`; return; }
  Q.cur = q; Q.answered = false;
  Q.recent.push(q.item.id); if (Q.recent.length > 8) Q.recent.shift();
  const mode = Q.cfg.mode;
  const right = mode === "sprint" ? `<span class="timer" id="tm">${Q.time}s</span>` :
    `<span class="combo ${Q.combo >= 5 ? "hot" : ""}">${Q.combo >= 2 ? "🔥x" + Q.combo : ""}</span>`;
  const title = { practice: Q.cfg.only ? CAT[Q.cfg.only].name : "אימון חכם", exam: "סימולציית מבחן", sprint: "ספרינט ⚡", build: "בני את המנה" }[mode];
  const progW = Q.total ? Q.n / Q.total * 100 : mode === "sprint" ? Q.time / 60 * 100 : (Q.combo % 10) * 10;
  const text = q.html ? q.text : esc(q.text);
  let body = "";
  if (q.kind === "build") {
    body = `<div class="qsub">${esc(q.sub)}</div><div class="chips" id="chips">${q.chips.map((c, k) => `<button class="chip" data-k="${k}" onclick="this.classList.toggle('on')">${esc(c.t)}</button>`).join("")}</div>
      <button class="btn" id="chk" onclick="checkBuild()">בדיקה</button>`;
  } else {
    body = (q.ings ? `<div class="ings">${esc(q.ings)}</div>` : "") +
      `<div class="${q.kind === "tf" ? "tf" : "opts"}">${q.opts.map((o, k) => `<button class="opt" data-k="${k}" onclick="answer(${k})">${esc(o.t)}</button>`).join("")}</div>`;
  }
  $app.innerHTML = `<div class="top"><button class="back" onclick="${mode === "practice" || mode === "build" ? "finish()" : "go('home')"}">→</button><b>${title}</b><div style="display:flex;gap:6px;align-items:center">${right}<span class="pill">${Q.total ? Q.n + 1 + "/" + Q.total : "✓ " + Q.right}</span></div></div>
  <div class="qhead"><div class="prog"><i style="width:${progW}%"></i></div></div>
  <div class="qcard"><div class="qtype">${q.label}</div>
  <div class="qtext">${q.kind === "build" ? `<span class="qdish" style="font-size:22px">${esc(q.text)}</span>` : text}</div>${body}<div id="fb"></div></div>`;
}
function answer(k) {
  if (Q.answered) return; Q.answered = true;
  const q = Q.cur, ok = !!q.opts[k].ok;
  document.querySelectorAll(".opt").forEach((b, j) => {
    if (q.opts[j].ok) b.classList.add("good"); else if (j === k) b.classList.add("bad"); else b.classList.add("dim");
  });
  resolve(ok, document.querySelectorAll(".opt")[k], q.opts[k].t);
}
function checkBuild() {
  if (Q.answered) return; Q.answered = true;
  const q = Q.cur; let hit = 0, wrong = 0, miss = 0;
  document.querySelectorAll("#chips .chip").forEach(b => {
    const c = q.chips[+b.dataset.k], on = b.classList.contains("on");
    b.classList.remove("on"); b.disabled = true;
    if (c.ok && on) { b.classList.add("good"); hit++; }
    else if (c.ok) { b.classList.add("miss"); miss++; }
    else if (on) { b.classList.add("bad"); wrong++; }
  });
  document.getElementById("chk").remove();
  const ok = !wrong && !miss;
  const extra = ok ? "" : `<div style="font-size:14px;margin-top:4px">✓ ${hit} נכונים · ${miss ? "⚠️ פספסת " + miss + " (מסומן בכתום)" : ""}${miss && wrong ? " · " : ""}${wrong ? "✗ " + wrong + " לא שייכים" : ""}</div>`;
  resolve(ok, document.getElementById("chips"), ok ? "" : `פספוסים: ${miss}, מיותרים: ${wrong}`, extra, hit && !ok ? Math.max(2, hit * 2 - wrong * 2) : 0);
}
const PRAISE = ["מושלם! 🎉", "יאללה! 🔥", "בדיוק! ✨", "את תותחית! 💪", "נכון מאוד! 👏", "שף מחבק אותך 👨‍🍳", "בול! 🎯"];
const OOPS = ["כמעט… 🤏", "לא נורא, עכשיו תזכרי 💡", "אופס 🙈", "זה יחזור אלייך עוד מעט 🔁"];
function resolve(ok, el, yourAns, extra = "", partialXP = 0) {
  const q = Q.cur, mode = Q.cfg.mode;
  bump(q.item.id, ok); Q.n++;
  Q.log.push({ q, ok, your: yourAns });
  if (ok) {
    Q.right++; Q.combo++; Q.bestCombo = Math.max(Q.bestCombo, Q.combo);
    const gain = (q.kind === "build" ? 15 : 10) + Math.min(Q.combo, 10);
    Q.xp += gain; addXP(gain, el); beep("ok");
    if (Q.combo > 0 && Q.combo % 5 === 0) { confetti(70); toast("🔥 רצף של " + Q.combo + "!"); }
  } else {
    Q.combo = 0; beep("bad");
    if (partialXP) { Q.xp += partialXP; addXP(partialXP, el); }
    if (mode === "sprint") Q.addPenalty(3);
  }
  if (mode === "sprint") return setTimeout(() => Q && Q.cfg.mode === "sprint" && Q.time > 0 && nextQuestion(), ok ? 350 : 900);
  if (mode === "exam") return setTimeout(() => Q && nextQuestion(), 650);
  const d = q.item;
  const learn = d.fact ? `<div class="mini"><b>התשובה:</b> ${esc(d.a)}</div>` : `<div class="mini">${dishCard(d)}</div>`;
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><div class="t">${ok ? pick(PRAISE) : pick(OOPS)}</div>${extra}${!ok && q.kind !== "build" ? `<div><b>התשובה הנכונה:</b> ${esc(q.answer)}</div>` : ""}${learn}</div>
  <button class="btn ${ok ? "" : "gold"}" id="nx" onclick="nextQuestion()">הבא ←</button>`;
  document.getElementById("nx").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function finish() {
  if (!Q) return go("home");
  const mode = Q.cfg.mode;
  const restore = Q.restoreCats; if (restore) { S.cats = restore; Q.restoreCats = null; }
  if (stopTimer) { stopTimer(); stopTimer = null; }
  if (!Q.n) { Q = null; return go("home"); }
  const pct = Math.round(Q.right / Q.n * 100);
  let headline = "", rec = false;
  if (mode === "exam") { if (pct > S.best.exam) { S.best.exam = pct; rec = true; } headline = `<div class="score">${pct}%</div><div class="grade">${pct >= 95 ? "מוכנה למבחן! 👑" : pct >= 85 ? "כמעט שם! עוד סיבוב 💪" : pct >= 70 ? "בדרך הנכונה 🌱" : "עוד קצת כרטיסיות ונחזור 📖"}</div>`; }
  else if (mode === "sprint") { if (Q.right > S.best.sprint) { S.best.sprint = Q.right; rec = true; } headline = `<div class="score">${Q.right}</div><div class="grade">תשובות נכונות ב-60 שניות${rec ? " · שיא חדש! 🏆" : ""}</div>`; }
  else headline = `<div class="score">${Q.right}/${Q.n}</div><div class="grade">רצף הכי ארוך: ${Q.bestCombo} 🔥</div>`;
  save();
  if (rec || pct >= 90) { confetti(160); beep("win"); }
  const mistakes = Q.log.filter(l => !l.ok);
  const cfg = JSON.stringify(Q.cfg).replace(/"/g, "&quot;");
  $app.innerHTML = hdr("סיכום") + `<div class="qcard">${headline}<p class="sub center">+${Q.xp} XP · רמה: ${level().name}</p>
    <button class="btn gold" onclick="go('quiz',${cfg})">עוד סיבוב 🔁</button><button class="btn ghost" onclick="go('home')">למסך הבית</button></div>
    ${mistakes.length ? `<h2>על מה לחזור (${mistakes.length})</h2>` + mistakes.map(l => {
      const d = l.q.item;
      const qt = l.q.kind === "build" ? "בני את המנה: " + esc(d.n) : (l.q.html ? l.q.text : esc(l.q.text));
      return `<div class="mistake"><div class="q">${qt}</div>${l.q.ings ? `<div class="y" style="color:var(--muted)">${esc(l.q.ings)}</div>` : ""}<div class="a">✓ ${esc(l.q.answer)}</div>${l.your ? `<div class="y">✗ ${esc(l.your)}</div>` : ""}${d.fact ? "" : `<div class="mini" style="background:var(--paper2)">${esc(d.n)}: ${esc(d.d || (d.i || []).join(", "))}</div>`}</div>`;
    }).join("") : `<p class="sub center">בלי אף טעות! 🎉</p>`}`;
  Q = null;
}

go("home");
</script>
</body>
</html>
